# Tracks every SHA-pinned `uses:` in this repo's own workflow files
# against their upstream tagged releases -- both third-party actions
# (e.g. actions/checkout) and the cross-repo lucid-attest/sign.yml pin,
# now that lucid-attest tags real releases (v1.0.0+). Opens a PR here
# proposing the bump, never merges automatically.
#
# IMPORTANT, review this by hand every time: Dependabot only understands
# the standard `uses: owner/repo@sha` syntax -- it updates the `attest`
# job's `uses:` line, but has no way to know assay.yml also duplicates
# that same SHA as a literal in env.SIGNER_WORKFLOW_SHA above it (the
# "reusable-workflow calls don't accept expressions in uses:" constraint
# documented at that env block). A merged Dependabot PR that only
# touches the `uses:` line leaves env.SIGNER_WORKFLOW_SHA stale, which
# then makes CERT_IDENTITY (which does read it live) assert the WRONG
# signer identity -- fails closed as an identity-verification failure in
# `verify`, not a silent hole, but still a real CI break. Manually update
# env.SIGNER_WORKFLOW_SHA to match before merging any bump PR that
# touches the `attest` job's `uses:` line -- exactly the same
# "keep in sync" step a hand-authored bump already required.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
