[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-assay"
version = "0.1.0"
description = "Deterministic quality scoring and in-toto attestation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "sigstore>=3.0.0,<5.0.0",
    "tree-sitter>=0.22,<1.0",
    "tree-sitter-typescript>=0.21,<1.0",
    "tree-sitter-javascript>=0.21,<1.0",
    "tree-sitter-go>=0.21,<1.0",
    "tree-sitter-java>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "jsonschema>=4.0.0",
    # Diff-scoped mutation testing (cli/mutation.py). Pinned to the 3.x
    # line confirmed empirically during that module's development
    # (export-cicd-stats/results/show CLI shape, dotted mutant-key
    # namespacing) -- a future major bump needs the same empirical
    # re-verification before widening this range.
    "mutmut>=3.7.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/lucid-provenance/lucid-assay"
Repository = "https://github.com/lucid-provenance/lucid-assay"

[project.scripts]
lucid = "cli.main:main"
lucid-assay = "cli.main:main"
# Backwards-compatible aliases for the pre-rebrand Plinth Assay name.
plinth = "cli.main:main"
plinth-assay = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "schema*"]

[tool.setuptools.package-data]
# Without this, a plain `pip install .` builds a wheel that never
# contains the schema JSON at all -- setuptools only bundles *.py files
# into a package by default, everything else needs an explicit
# package-data declaration. cli.verify's schema-file resolution
# (Path(__file__).resolve().parent.parent / "schema" / "*.json") expects
# this file to land as a sibling to the installed cli/ package -- see
# schema/__init__.py's own comment for the full story of why this was
# missing and how it was found.
schema = ["*.json"]

[tool.pytest.ini_options]
# tests/fixtures/ast_assertions/ holds source-text fixtures for the
# multi-language AST assertion engine (tests/test_ast_assertions.py parses
# them directly via inspect_test_suite). The Python ones are named
# test_*.py to satisfy PythonAssertionVisitor's own discovery convention,
# which makes pytest's default collector try to import and *execute* them
# as real tests too -- they're not; they reference undefined helpers on
# purpose to exercise zero-assertion/tautology detection. Excluded from
# collection by directory basename.
norecursedirs = ["ast_assertions", ".git", ".venv", "node_modules", "build", "dist"]

[tool.mutmut]
# cli/mutation.py generates mutants for cli/ every invocation (cheap,
# AST-based, no test execution) but only *tests* the ones a per-
# invocation `mutmut run "<dotted.module>.*"` wildcard selects -- see
# that module's own docstring. Without source_paths set here, mutmut
# can't guess where the code to mutate is at all and raises
# FileNotFoundError before ever reaching the wildcard filter (confirmed
# empirically: this was missing during this feature's own development
# and the real end-to-end verification run caught it).
#
# scripts/ and schema/ are in source_paths (copied into mutmut's
# mutants/ working copy alongside cli/) but *not* mutated (only_mutate
# scopes real mutation to cli/* alone) -- confirmed empirically that
# omitting either breaks mutmut's own baseline test run from inside
# mutants/: it copies tests/ too (per pytest_add_cli_args_test_selection
# below), and (1) tests/test_scripts_ingestion.py imports
# scripts._ingestion_lib, (2) several tests (e.g. test_builder.py's own
# _SCHEMA_PATH) resolve schema/lucid-attestation-v1.schema.json via a
# path relative to the test file's own __file__, which then resolves
# under mutants/ instead of the real repo root.
source_paths = ["cli", "scripts", "schema"]
only_mutate = ["cli/*"]
pytest_add_cli_args_test_selection = ["tests"]