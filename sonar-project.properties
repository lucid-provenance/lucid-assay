sonar.organization=tenax-io
sonar.projectKey=tenax-io_tenax-assay
sonar.projectName=tenax-assay
sonar.sources=cli
sonar.tests=tests
sonar.python.coverage.reportPaths=build/coverage.xml
sonar.python.xunit.reportPath=build/junit.xml

# tests/fixtures/ast_assertions/** are deliberately-crafted "bad code"
# source-text fixtures (tautological assertions, zero-assertion bodies,
# a package/directory mismatch, ...) that cli/parsers/ast/*_visitor.py's
# multi-language assertion-integrity engine is exercised against -- see
# tests/test_ast_assertions.py::FixtureSuiteTests. They are never compiled
# or executed themselves, only parsed as text by our own Tree-sitter/ast
# visitors, so Sonar's per-language quality rules (identical
# actual/expected expressions, missing assertions, package/directory
# mismatches, ...) do not apply to them the way they would to real test
# code -- inline NOSONAR markers on individual lines proved unreliable
# here, so the whole fixture tree is excluded from analysis instead.
sonar.test.exclusions=tests/fixtures/ast_assertions/**