name: Sign In-Toto Statement (Sigstore Keyless)

# Reusable workflow: the trusted signing boundary for tenax-assay-produced
# attestations.
#
# Public entrypoint: `uses: tenax-io/tenax-attest/.github/workflows/
# sign.yml@v1` -- callers track the `v1` SemVer-major release tag rather
# than a commit SHA, so a new v1.x.y release of this workflow is picked up
# by every caller without a corresponding commit in their own repo. See
# "Releases" below for what that requires of *this* repo to stay safe.
# Called from a *calling* repo's own job (see tenax-io/tenax-assay's
# .github/workflows/assay.yml `attest` job) -- never invoked directly.
#
# Why this lives in its own repo rather than as a job inside the calling
# repo's own workflow file: env.TRUSTED_SIGNER_REF below is a ref of
# tenax-io/tenax-assay hardcoded in *this* file -- it is deliberately NOT a
# `workflow_call` input the caller can set. What actually executes is this
# file, checked out from THIS repo at whatever ref the caller's `uses:`
# line resolves (currently the `v1` tag; see that line's own comment), so
# a PR to tenax-assay that rewrites its own workflow file, or the pipeline
# code TRUSTED_SIGNER_REF points at, cannot also rewrite what this job
# trusts -- neither is part of that PR's diff at all, and neither can
# steer this job to check out a different tenax-assay ref than the one
# tracked here.
#
# A caller-controlled `signer-ref` input previously existed here and was
# removed deliberately: the privileged job below (id-token: write) must
# never execute code checked out from a ref an untrusted caller supplies
# dynamically. TRUSTED_SIGNER_REF is the opposite of that -- a ref this
# repo alone controls -- but it is now a tracked tag (`refs/tags/v1`)
# rather than an immutable commit SHA, which trades a cryptographic
# guarantee for release-process convenience. See "Releases" below for the
# tag-protection rules that are the *entire* remaining backstop against
# that ref moving to unreviewed code; there is no downstream check that
# would catch it if that ruleset were ever missing or bypassed.
#
# id-token: write is granted to exactly one job, in exactly one workflow,
# in this one repo. No other job anywhere in the calling repo's own
# workflow has it (see assay.yml's top-level `permissions:` comment).
#
# ## Releases
#
# This repo's own `sign.yml` (the file callers `uses:`) and the
# tenax-assay commit it trusts (TRUSTED_SIGNER_REF, below) are versioned
# and released independently, each as real, tagged GitHub Releases:
#
#   - This repo: tag `vX.Y.Z` on the commit being released, plus a moving
#     `vX` major-version alias (`v1`, `v2`, ...) repointed to the latest
#     `vX.*.*` on every release -- the same convention
#     `actions/*`/`github/codeql-action`/etc. use. Callers normally track
#     the moving `vX` alias (`uses: ...@v1`); pin to an exact `vX.Y.Z` tag
#     instead if you want a specific release to never move under you.
#   - tenax-assay: TRUSTED_SIGNER_REF here tracks that repo's own `vX`
#     release tag the same way, rather than a commit SHA -- bump the
#     *value* it points to only by cutting a new tenax-assay release, never
#     by hand-editing a SHA in this file.
#
# Both `v1` tags (this repo's and tenax-assay's) MUST be protected by a
# repository ruleset restricting who can create/update/delete refs
# matching `v*` (Settings -> Rules -> Rulesets -> New tag ruleset), scoped
# to release-manager accounts only, with deletion and non-fast-forward
# updates blocked. Because CERT_IDENTITY in tenax-assay's verify gate
# matches this workflow's SAN by ref name (`.../sign.yml@refs/tags/v1`,
# not by commit), that ruleset -- not the identity check -- is what
# actually prevents `v1` from being silently repointed at unreviewed code
# post-release. Treat changes to it with the same scrutiny as a
# branch-protection change on `main`.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the workflow-run artifact containing the unsigned *.unsigned.json statement files"
        required: true
        type: string
      statement-files:
        description: "Newline-separated list of *.unsigned.json filenames (within artifact-name) to sign"
        required: true
        type: string
      dry-run-sign:
        description: "Simulate DSSE envelope creation without a real OIDC/Sigstore round-trip"
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the workflow-run artifact this job uploads the signed *.dsse.json envelopes to"
        value: signed-statements

permissions: {}

# The one and only ref of tenax-io/tenax-assay this job will ever check out
# cli/sign.py + cli/oidc_signer.py from. Hardcoded here rather than
# accepted as a workflow_call input -- see the file header for why. Bump
# this only by cutting a new tenax-assay `v1.x.y` release and repointing
# tenax-assay's own `v1` tag at it (that repo's release process), never by
# hand-editing this value to a branch or an arbitrary ref.
env:
  TRUSTED_SIGNER_REF: refs/tags/v1

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting -- see file header
      contents: read

    steps:
      # Explicit repository:/ref: -- this is NOT a self-checkout of
      # tenax-attest. It checks out tenax-io/tenax-assay at the hardcoded
      # env.TRUSTED_SIGNER_REF above (never anything caller-supplied), into
      # a subdirectory, purely to get the small, stable cli/sign.py +
      # cli/oidc_signer.py signing surface (see those files' own
      # docstrings) -- nothing from the calling build job's own checkout
      # is trusted or reused here.
      - name: Checkout Pinned tenax-assay Signer Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tenax-io/tenax-assay
          ref: ${{ env.TRUSTED_SIGNER_REF }}
          path: _signer

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "_signer/uv.lock"

      - name: Install Signer Dependencies
        working-directory: _signer
        run: uv sync --frozen --extra dev

      - name: Cache Sigstore TUF Metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download Unsigned Statements
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact-name }}
          path: unsigned

      # Signs exactly the files the caller named, nothing else -- a file
      # present in the artifact but not listed in inputs.statement-files
      # is silently ignored, not swept up. Each `tenax-assay sign` call
      # (cli/sign.py, checked out above) reads only that one file's bytes;
      # it never touches anything else this job downloaded.
      #
      # inputs.statement-files is caller-supplied, so every line read out of
      # it is treated as hostile input, not a trusted filename, before it
      # touches the filesystem or the Python CLI:
      #   - rejected outright if it contains `/`, `\`, or `..` -- a bare
      #     filename can never walk outside ./unsigned/ (the only directory
      #     this step ever reads from) via a path-traversal or separator
      #     sequence.
      #   - `basename -- "$f" ...` (the `--`) stops a hyphen-prefixed
      #     filename (e.g. "--help.unsigned.json") from being parsed as a
      #     flag by basename itself.
      - name: Sign Statements
        env:
          STATEMENT_FILES: ${{ inputs.statement-files }}
          DRY_RUN_SIGN: ${{ inputs.dry-run-sign }}
        run: |
          mkdir -p signed
          DRY_RUN_ARGS=()
          if [ "$DRY_RUN_SIGN" = "true" ]; then
            DRY_RUN_ARGS=(--dry-run-sign)
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              */*|*\\*|*..*)
                echo "ERROR: rejecting unsafe statement filename: $f" >&2
                exit 1
                ;;
            esac

            base="$(basename -- "$f" .unsigned.json)"
            (cd _signer && uv run --no-sync python -m cli.main sign \
              "../unsigned/$f" --out "../signed/${base}.dsse.json" "${DRY_RUN_ARGS[@]}")
          done <<< "$STATEMENT_FILES"

      - name: Upload Signed Statements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-statements
          path: signed/
          if-no-files-found: error
