name: Plinth Assay

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for Sigstore keyless OIDC minting
  contents: read
  pull-requests: read

jobs:
  assay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to calculate patch coverage diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" sigstore pytest pytest-cov

      - name: Execute Tests with Telemetry
        run: |
          mkdir -p build
          pytest \
            --junitxml=build/junit.xml \
            --cov=cli \
            --cov-report=xml:build/coverage.xml \
            tests/

      - name: Mint Signed Plinth Attestation
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXTRA_ARGS=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # If base.sha is somehow unset, fall back to git merge-base with origin/main
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA=$(git merge-base origin/main HEAD)
            fi
            EXTRA_ARGS="--base-sha $BASE_SHA --pr-number $PR_NUMBER"
          fi

          echo "Running with EXTRA_ARGS: $EXTRA_ARGS"

          python -m cli.main \
            --junit-xml build/junit.xml \
            --coverage-report build/coverage.xml \
            --image-ref "ghcr.io/${{ github.repository }}:${HEAD_SHA}" \
            --image-digest "sha256:$(git rev-parse HEAD | sha256sum | awk '{print $1}')" \
            --head-sha "${HEAD_SHA}" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --min-rcs 65 \
            --sign \
            --out build/plinth-assay.dsse.json \
            $EXTRA_ARGS

      - name: Verify Plinth Attestation Gate
        run: |
          VERIFY_ARGS="--min-rcs 65"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERIFY_ARGS="$VERIFY_ARGS --disallow-degraded"
          fi

          python -m cli.verify build/plinth-assay.dsse.json $VERIFY_ARGS

      - name: Upload In-Toto Attestation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plinth-assay-attestation
          path: build/plinth-assay.dsse.json
          if-no-files-found: error