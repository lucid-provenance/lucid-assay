[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plinth-assay"
version = "0.1.0"
description = "Deterministic quality scoring and in-toto attestation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "sigstore>=3.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
plinth = "cli.main:main"
plinth-assay = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "schema*"]