name: Tenax Assay

# Deliberately `pull_request`, NOT `pull_request_target`: this workflow
# checks out and executes code from the PR head ref, so it must run in the
# restricted, no-secrets context `pull_request` provides for fork PRs.
# `pull_request_target` runs with base-branch permissions/secrets against
# untrusted fork code and must never be substituted here.

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable stage profiling output'
        type: boolean
        default: true

# `push` fires with no PR context of its own (no base sha, no PR number) --
# unlike a `pull_request` event's own fields. Without recovering it, every
# push-triggered run (a merge landing on `main`, or a plain feature-branch
# push) would mint degraded (no_pr_context/patch_coverage_unavailable).
# `build`'s "Resolve PR Context for a Push-Triggered Run" step below closes
# that gap: it looks up whichever PR GitHub associates with the pushed
# commit (works for merge/squash/rebase alike, and for a still-open PR's
# branch commits too -- GitHub tracks the association server-side, not by
# walking commit parents) and feeds its base sha/number into the mint step
# the same way a `pull_request` event's own fields would. A push with no
# associated PR (a genuine early WIP push before a PR exists, or the rare
# admin-privileged direct push to `main`) mints without PR context exactly
# as it always has -- see `verify`'s --disallow-degraded comment for why
# that specific case still isn't gate-enforced.
#
# No `id-token: write` at the workflow level: that's the Sigstore OIDC
# minting permission, and it's granted *only* to the `attest` job below --
# `build` runs the PR's own tests/deps/CodeQL, so it must never be able to
# reach the signing credential itself (that's the whole point of splitting
# this into build -> attest -> verify; see the `attest` job's comment).
# No `administration` scope here either -- it isn't a scope GITHUB_TOKEN
# can be granted via this block at all (needed to query
# /repos/{owner}/{repo}/rules/branches/{branch}); see the "Generate GitHub
# App Token" step below, which mints a separate, narrowly-scoped token for
# that instead. `pull-requests: read` *is* granted, job-scoped to `build`
# alone (see its own `permissions:` block) -- needed for the PR-context
# lookup above; patch coverage itself still comes from local git diff, not
# the GitHub API.
permissions:
  contents: read
  security-events: write # Required for github/codeql-action/analyze to upload SARIF to code scanning

# SIGNER_WORKFLOW_SHA is the *single* source of truth for the pinned commit
# tenax-io/tenax-attest/.github/workflows/sign.yml is trusted at -- it must
# be kept byte-for-byte identical to the SHA pinned on the `attest` job's
# `uses:` line below (GitHub Actions reusable-workflow calls don't accept
# expressions in `uses:`, so that line can't just reference this var
# directly; bump both together, in the same commit, whenever `attest`'s pin
# moves). The `verify` job's admission gate reads it back out via
# `${{ env.SIGNER_WORKFLOW_SHA }}` to build --cert-identity, so the gate can
# never drift from what `attest` actually invoked.
env:
  SIGNER_WORKFLOW_SHA: ddc340f1c442957c0d1801ff3db69cc820bbc307 # fix(pass-builder-id-explicitly) -- keep in sync with attest job's `uses:` pin

jobs:
  # Runs the PR's own code: tests, coverage, CodeQL, SonarQube, RCS scoring.
  # Produces one *unsigned* RCS statement file and nothing else that crosses
  # into the attest job below -- no id-token permission here at all, so
  # nothing running in this job (including a compromised dependency or a
  # malicious test-suite change) can mint a Sigstore signing identity.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read # "Resolve PR Context for a Push-Triggered Run" below
    outputs:
      # Consumed by `attest` below as subject-name/subject-digest -- the
      # only provenance-relevant values tenax-attest's isolated signer job
      # accepts from this (untrusted) job; everything else it needs to
      # construct real SLSA Build Level 3 provenance comes from its own
      # trusted context instead (see that job's `uses:` comment).
      image-ref: ${{ steps.mint.outputs.image-ref }}
      image-digest: ${{ steps.mint.outputs.image-digest }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Full history needed to calculate patch coverage diff

      # No explicit build step needed between init and analyze: Python is
      # extracted statically by the CodeQL CLI rather than traced through a
      # compile/autobuild step (unlike compiled languages), so running the
      # test suite in between (below) is just this workflow's own test
      # step, not something CodeQL depends on.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: python

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # uv resolves and installs the dependency set far faster than pip
      # (no full backtracking resolver invocation, and its own content-
      # addressed cache avoids re-downloading/re-building wheels run to
      # run). `enable-cache: true` persists that cache across workflow
      # runs via actions/cache internally, keyed off cache-dependency-glob.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --frozen: install exactly what uv.lock pins (versions *and*
      # hashes), refusing to re-resolve even if pyproject.toml has
      # drifted from it -- deterministic, reproducible builds, and no
      # arbitrary "resolve whatever's newest and compatible today" step
      # that could pull in a since-compromised transitive dependency
      # between runs. `--extra dev` brings in pytest/pytest-cov/
      # pytest-xdist/jsonschema alongside the core runtime deps, all from
      # the one lockfile -- nothing installed ad hoc outside it.
      - name: Install Dependencies
        run: |
          uv sync --frozen --extra dev

      # `uv run --no-sync`: execute inside the environment `uv sync` just
      # populated without uv re-checking/re-syncing it first (already
      # synced explicitly above, so that would just be redundant work) --
      # not a second, different environment.
      - name: Execute Tests with Telemetry
        run: |
          mkdir -p build
          uv run --no-sync pytest \
            -n auto \
            --junitxml=build/junit.xml \
            --cov=cli \
            --cov-report=xml:build/coverage.xml \
            tests/

      # `output` is a directory, not a file: the CodeQL CLI names the SARIF
      # file after the analyzed language itself, so a single `languages:
      # python` init (above) produces build/codeql/python.sarif here --
      # the exact path cli.main's --sarif expects below. `upload` defaults
      # to "always" (uploads to GitHub code scanning too, hence
      # security-events: write above); left at its default since surfacing
      # findings in the Security tab is independent of also feeding them
      # into the attestation.
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          output: build/codeql
          category: python

      # SONAR_TOKEN, like APP_PRIVATE_KEY above, is unavailable in the
      # restricted `pull_request` context a fork PR runs under -- guarded
      # the same way, so an external contributor's PR degrades (no
      # SonarQube enrichment) instead of failing outright.
      # Project metadata (organization, projectKey, sources, coverage/xunit
      # paths) lives in sonar-project.properties at the repo root -- the
      # action reads it automatically, so it's the single source of truth
      # rather than duplicating those same values here via `args:` (two
      # copies of "where are the sources" is exactly how that file's
      # sonar.sources briefly pointed at a nonexistent src/ directory
      # instead of cli/).
      - name: SonarQube Cloud Scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # SonarQube Cloud's scanner analyzes server-side and doesn't emit a
      # local SARIF file the way CodeQL does -- there is no scanner
      # property that makes it write one out (`sonar.sarif.reportPaths` is
      # an *input* for feeding an existing SARIF into Sonar, not an
      # output toggle). Its quality-gate/complexity/debt metrics are
      # pulled back out via the Measures API instead, matching
      # cli.parsers.sarif.parse_sonar_metrics_file's expected
      # {"component": {"measures": [...]}} shape, and merged into a
      # scanned tool's extensions via --sonar-metrics below.
      # continue-on-error: enrichment data only -- cli.main already
      # degrades to a warning (not a failure) when --sonar-metrics can't
      # be read, so a transient API hiccup here must never fail the job.
      - name: Fetch SonarQube Cloud Measures
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # HTTP Basic auth (token as username, empty password) rather than
          # a Bearer header: it's the auth method SonarCloud/SonarQube user
          # tokens have supported across every scanner/API version, where
          # Bearer support is newer and version-dependent.
          curl -sSf \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component?component=tenax-io_tenax-assay&metricKeys=alert_status,sqale_index,cognitive_complexity" \
            -o build/sonar-measures.json

      # Mints a short-lived GitHub App installation token so branch-governance
      # inspection (cli.parsers.github_rules) can query the rules-for-branch
      # and rulesets endpoints, which require 'Administration: Read'
      # repository permission -- a permission the default GITHUB_TOKEN can
      # never be granted via this workflow's `permissions:` block (see the
      # comment there). Skipped for fork PRs: `secrets.APP_PRIVATE_KEY` is
      # unavailable in the restricted `pull_request` context those run
      # under (see the top-of-file comment), so this step would otherwise
      # fail every external contributor's PR outright. When skipped, the
      # token output is empty and cli.main / cli.parsers.github_rules
      # degrade branch-governance data to unavailable rather than raising
      # (see cli/parsers/github_rules.py's module docstring).
      - name: Generate GitHub App Token
        id: app-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: read

      # push carries no PR context of its own -- see the `on:` block's
      # comment for the full rationale. Looks up whichever PR GitHub
      # associates with the pushed commit itself (works uniformly for
      # merge/squash/rebase, and for a still-open PR's own branch commits
      # too); empty outputs (no associated PR) are a legitimate, handled
      # case -- the mint step below falls back to no PR context exactly
      # as it already does for workflow_dispatch.
      - name: Resolve PR Context for a Push-Triggered Run
        id: pr-context
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls_json="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")"
          echo "base-sha=$(echo "$pulls_json" | jq -r '.[0].base.sha // empty')" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pulls_json" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # Deliberately no --sign/--dry-run-sign here: this job has no
      # id-token permission, so it could not mint a Sigstore identity even
      # if it tried. Written unsigned; the separate `attest` job below
      # (the only one with id-token: write) signs it from the artifact
      # this step uploads, never from anything it computes itself.
      #
      # No --emit-slsa-provenance here anymore: this job only mints the
      # assay/v1 RCS statement now. SLSA v1.0 provenance (Build Level 3)
      # is constructed by `attest` below, inside tenax-attest's isolated
      # signer job, from that job's own trusted context -- not by this
      # (untrusted) job -- see that job's `uses:` comment for why.
      - name: Mint Unsigned Tenax Attestation
        id: mint
        env:
          GOVPLANE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Event-driven SHA resolution: base.sha is populated by GitHub
          # directly on the pull_request event payload itself, at the time
          # the run was triggered. It is used as-is, deliberately with no
          # runner-side `git merge-base` fallback -- computing a merge-base
          # on the runner is ambiguous (it reflects the *runner's* current
          # view of history, which can differ from the base GitHub actually
          # resolved the event against) and must never silently substitute
          # for the authoritative event value. On a push event, falls back
          # to whatever "Resolve PR Context for a Push-Triggered Run" found
          # (empty for a push with no associated PR).
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr-context.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr-context.outputs.number }}
          # On a pull_request event, github.ref_name is the synthetic
          # "<number>/merge" ref (e.g. "5/merge"), not a real branch --
          # querying branch governance for that name 404s/403s every time.
          # --branch feeds cli.parsers.github_rules.inspect_branch_governance
          # and is recorded as the attestation's target branch, so what's
          # wanted here is the PR's actual base branch (the one protection
          # rules apply to); github.ref_name is only correct on a direct push.
          BRANCH_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          EXTRA_ARGS=(--debug)
          if [ -n "$BASE_SHA" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "ERROR: BASE_SHA resolved but PR_NUMBER did not; refusing to mint with inconsistent PR context" >&2
              exit 1
            fi
            EXTRA_ARGS=(--base-sha "$BASE_SHA" --pr-number "$PR_NUMBER")
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ERROR: github.event.pull_request.base.sha was empty on a pull_request event; refusing to guess a base commit" >&2
            exit 1
          fi

          # CodeQL always runs (no secret dependency), but the SARIF path
          # is still guarded on existence rather than assumed -- if the
          # CodeQL CLI's output-naming convention ever changes, this run
          # should degrade (cli.main treats a missing --sarif file as a
          # warning, not a hard failure) rather than break the mint step.
          # SonarQube's measures export is guarded the same way since its
          # own step above is fork-PR-skipped and continue-on-error.
          if [ -f build/codeql/python.sarif ]; then
            EXTRA_ARGS+=(--sarif build/codeql/python.sarif)
          else
            echo "WARNING: build/codeql/python.sarif not found; skipping CodeQL SARIF ingestion" >&2
          fi
          if [ -f build/sonar-measures.json ]; then
            EXTRA_ARGS+=(--sonar-metrics build/sonar-measures.json)
          fi

          echo "Running with EXTRA_ARGS: ${EXTRA_ARGS[*]}"

          IMAGE_REF="ghcr.io/${{ github.repository }}:${HEAD_SHA}"
          IMAGE_DIGEST="sha256:$(git rev-parse HEAD | sha256sum | awk '{print $1}')"
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          uv run --no-sync python -m cli.main \
            --junit-xml build/junit.xml \
            --coverage-report build/coverage.xml \
            --image-ref "$IMAGE_REF" \
            --image-digest "$IMAGE_DIGEST" \
            --head-sha "${HEAD_SHA}" \
            --repository "${{ github.repository }}" \
            --branch "${BRANCH_NAME}" \
            --github-token "$GOVPLANE_GITHUB_TOKEN" \
            --min-rcs 65 \
            --out build/tenax-assay.unsigned.json \
            "${EXTRA_ARGS[@]}"

      - name: Upload Unsigned Statements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-statements
          path: build/tenax-assay.unsigned.json
          if-no-files-found: error

  # The *only* job with id-token: write -- signs the RCS statement `build`
  # uploaded, and -- via subject-name/subject-digest below -- additionally
  # CONSTRUCTS a SLSA v1.0 provenance statement (SLSA Build Level 3) from
  # its own trusted context and signs that too, atomically. The signing
  # job's code lives entirely in tenax-io/tenax-attest (a separate,
  # branch-protected repo -- see contrib/tenax-attest-repo/ in this repo
  # for its content/rationale), checked out there at a commit SHA (`uses:`
  # below) pinned independently of whatever ref triggered this run -- so a
  # PR that fully rewrites this workflow file, or tenax-assay's own
  # pipeline code, in the same PR cannot also change what the signer
  # trusts, since that code isn't part of this PR's diff at all.
  #
  # subject-name/subject-digest are the only provenance-relevant values
  # tenax-attest's isolated signer job accepts from this (untrusted) job:
  # everything else that makes the statement SLSA-meaningful -- builder
  # identity, source binding, resolved dependencies -- comes from
  # tenax-attest's own ambient context and its own read-only source
  # checkout, never from anything this job computed.
  #
  # This job has no way to choose which tenax-assay commit sign.yml checks
  # out for cli/sign.py/cli/oidc_signer.py/cli/provenance.py: that pin
  # lives hardcoded inside tenax-attest's own sign.yml
  # (env.TRUSTED_SIGNER_SHA), not as a `workflow_call` input here -- a
  # caller-supplied `signer-ref` input was deliberately removed so the
  # privileged signing job can never be pointed at caller-chosen code.
  # Bumping which tenax-assay commit the signer trusts is exclusively a
  # tenax-attest-repo change, same discipline as bumping the `uses:` SHA
  # below whenever tenax-attest's own sign.yml changes.
  attest:
    needs: build
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting
      contents: read
    uses: tenax-io/tenax-attest/.github/workflows/sign.yml@ddc340f1c442957c0d1801ff3db69cc820bbc307 # keep in sync with env.SIGNER_WORKFLOW_SHA above
    with:
      artifact-name: unsigned-statements
      statement-files: |
        tenax-assay.unsigned.json
      subject-name: ${{ needs.build.outputs.image-ref }}
      subject-digest: ${{ needs.build.outputs.image-digest }}

  # Downloads the signed envelopes `attest` produced and evaluates
  # tenax-assay's own admission policy gates against them, plus both SLSA
  # tracks (Source, Build) in one unified report. No id-token permission
  # here either -- reading/verifying a signature doesn't require one,
  # only minting one does.
  verify:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --frozen --extra dev

      # Sigstore identity verification (below) fetches the same TUF trust
      # root a fresh cache miss would otherwise re-download every run --
      # see the identical step in the `attest` job above for why this is
      # safe to treat as a pure cache-hit optimization, never a
      # correctness dependency.
      - name: Cache Sigstore TUF Metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download Signed Statements
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-statements
          path: build

      - name: Verify Tenax Attestation Gate
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          # Pins the admission gate to the exact quarantined signer identity:
          # not just "some workflow in tenax-io/tenax-attest", but that repo's
          # sign.yml specifically, at the same commit SHA `attest` invoked
          # (env.SIGNER_WORKFLOW_SHA, declared once at the top of this file).
          # --expected-repository/--expected-ref alone only constrain claims
          # about *this* repo's own ref -- they say nothing about which
          # workflow minted the OIDC token, so without --cert-identity any
          # other job in tenax-assay that ever acquired id-token: write could
          # sign an envelope this gate would still accept.
          CERT_IDENTITY: https://github.com/tenax-io/tenax-attest/.github/workflows/sign.yml@${{ env.SIGNER_WORKFLOW_SHA }}
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          # Binds admission to the *caller* side of the identity too: not
          # just "signed by the quarantined tenax-attest signer" (that's
          # what --cert-identity above already pins), but "signed on behalf
          # of a run this workflow itself triggered" -- github.workflow is
          # this workflow's own `name:` ("Tenax Assay"), which GitHub's OIDC
          # token carries as the `workflow` claim for every job in this run,
          # including the reusable `attest` job. Without this, any other
          # workflow in tenax-io/tenax-assay (present or future) that ever
          # called the same tenax-attest signer would still pass this gate,
          # since --expected-repository alone doesn't distinguish which
          # workflow file within the repo triggered the signing.
          EXPECTED_WORKFLOW: ${{ github.workflow }}
        run: |
          # Built as a bash array, not a string handed to word-splitting:
          # the previous string-concatenation form embedded literal `"`
          # characters into each flag's value (they were inside an
          # already-double-quoted string, so `\"` had no quoting effect),
          # which made --expected-repository/--expected-ref never match the
          # real certificate claims and failed the gate on every run.
          VERIFY_ARGS=(
            --min-rcs 65
            --expected-repository "$EXPECTED_REPOSITORY"
            --expected-ref "$EXPECTED_REF"
            --expected-workflow "$EXPECTED_WORKFLOW"
            --cert-identity "$CERT_IDENTITY"
            --cert-oidc-issuer "$CERT_OIDC_ISSUER"
            --slsa-envelope build/provenance.dsse.json
          )
          # pull_request (pre-merge) and push-to-main (post-merge/promotion,
          # now that "Resolve PR Context for a Push-Triggered Run" keeps it
          # from degrading on missing PR context -- see the `on:` block's
          # comment) are both gate-enforced. A plain push to a feat/**
          # branch is deliberately NOT enforced here: it may have no
          # associated PR yet (a genuine early WIP push), in which case
          # minting without PR context is expected and shouldn't block --
          # that branch's own eventual PR (or its post-merge push to main)
          # is what actually gets gated.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$EXPECTED_REF" = "refs/heads/main" ]; then
            VERIFY_ARGS+=(--disallow-degraded)
          fi

          uv run --no-sync python -m cli.verify build/tenax-assay.dsse.json "${VERIFY_ARGS[@]}"

      - name: Upload In-Toto Attestation Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tenax-assay-attestation
          path: |
            build/tenax-assay.dsse.json
            build/provenance.dsse.json
          if-no-files-found: error
