# Tracks every SHA-pinned `uses:` in this repo's own workflow files
# against their upstream tagged releases -- third-party actions (e.g.
# actions/checkout), plus the cross-repo lucid-attest-service/sign-client.yml
# pin once that repo starts tagging real releases (it doesn't yet -- see
# that repo's own "Known gaps" -- so this ecosystem currently tracks it
# by commit only, same as any other unreleased dependency). lucid-attest,
# the original signer this pin used to point at, is archived; it never
# reached the tagged-release state this comment used to describe either.
# Opens a PR here proposing the bump, never merges automatically.
#
# The duplicate-pin danger this comment used to warn about (a bump PR
# only touching the `attest` job's `uses:` line, leaving a separately-
# maintained env var stale) is now closed structurally, not just by
# manual review discipline: `verify`'s own "Derive expected signer
# identity" step parses that `uses:` line live at runtime, so there's
# nothing left to duplicate or drift. A bump PR touching only the
# `uses:` line is fully self-consistent now.
#
# `groups` bundles every github-actions bump into one PR per week
# instead of one PR per action -- confirmed necessary two ways, real
# evidence both times, 2026-09-02: (1) github/codeql-action/init and
# .../analyze must stay on matching versions (the config init writes is
# version-specific; a mismatch fails the job with "Loaded a
# configuration file for version 'X', but running version 'Y'"), and
# Dependabot's one-PR-per-`uses:`-reference default bumped only one half
# of that pair per PR; (2) five repos' first real week under Dependabot
# opened 19 separate single-action PRs total -- real, but unmanageably
# noisy for what's almost always a same-day batch of trivial version
# bumps. One wildcard pattern groups the whole github-actions ecosystem
# for this repo into a single PR; the codeql-action pairing is now just
# a side effect of that, not a special case.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
