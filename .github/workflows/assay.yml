name: Plinth Assay

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for Sigstore keyless OIDC minting
  contents: read
  pull-requests: read

jobs:
  assay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to calculate patch coverage diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" sigstore pytest pytest-cov

      - name: Execute Tests with Telemetry
        run: |
          mkdir -p build
          pytest \
            --junitxml=build/junit.xml \
            --cov=cli \
            --cov-report=xml:build/coverage.xml \
            tests/

      - name: Mint Signed Plinth Attestation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$BASE_SHA" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --base-sha $BASE_SHA --pr-number $PR_NUMBER"
          fi

          python -m cli.main \
            --junit-xml build/junit.xml \
            --coverage-report build/coverage.xml \
            --image-ref "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            --image-digest "sha256:$(git rev-parse HEAD | sha256sum | awk '{print $1}')" \
            --head-sha "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --min-rcs 65 \
            --sign \
            --out build/plinth-assay.dsse.json \
            $EXTRA_ARGS

      - name: Upload In-Toto Attestation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plinth-assay-attestation
          path: build/plinth-assay.dsse.json
          if-no-files-found: error