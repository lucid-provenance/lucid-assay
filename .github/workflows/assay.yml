name: Lucid Assay

# run-name: overrides the Actions run-list headline, which otherwise
# defaults to the triggering commit message -- indistinguishable at a
# glance from two runs of *this same* workflow on the *same* commit:
# `on.push`'s `feat/**` branch pattern and `on.pull_request` both fire
# independently the moment a feature-branch push also has an open PR
# against main, and a PR's title commonly just mirrors its commit
# message's subject line, so the old run-name (commit message ||
# PR title || ref name, no event-type prefix) rendered near-identically
# for both -- confirmed for real: PR #73 and its underlying push both
# showed as "Score & attest: feat(sbom): ..." in the run list, distinguishable
# only by a small, easy-to-miss event-type badge. Leading with the event
# type (+ PR number, when there is one) makes the two visually
# unambiguous at a glance, without needing that badge. Also still
# distinguishes from Publish Assay Image's own run on the same commit
# (both workflows can legitimately fire off one push when it touches
# cli/**) -- unchanged from this field's original purpose.
run-name: "Score & attest: ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event_name == 'push' && format('push ({0}): {1}', github.ref_name, github.event.head_commit.message) || format('{0}: {1}', github.event_name, github.ref_name) }}"

# Deliberately `pull_request`, NOT `pull_request_target`: this workflow
# checks out and executes code from the PR head ref, so it must run in the
# restricted, no-secrets context `pull_request` provides for fork PRs.
# `pull_request_target` runs with base-branch permissions/secrets against
# untrusted fork code and must never be substituted here.

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable stage profiling output'
        type: boolean
        default: true

# `push` fires with no PR context of its own (no base sha, no PR number) --
# unlike a `pull_request` event's own fields. Without recovering it, every
# push-triggered run (a merge landing on `main`, or a plain feature-branch
# push) would mint degraded (no_pr_context/patch_coverage_unavailable).
# `build`'s "Resolve PR Context for a Push-Triggered Run" step below closes
# that gap: it looks up whichever PR GitHub associates with the pushed
# commit (works for merge/squash/rebase alike, and for a still-open PR's
# branch commits too -- GitHub tracks the association server-side, not by
# walking commit parents) and feeds its base sha/number into the mint step
# the same way a `pull_request` event's own fields would. A push with no
# associated PR (a genuine early WIP push before a PR exists, or the rare
# admin-privileged direct push to `main`) mints without PR context exactly
# as it always has -- see `verify`'s --disallow-degraded comment for why
# that specific case still isn't gate-enforced.
#
# No `id-token: write` at the workflow level: that's the Sigstore OIDC
# minting permission, and it's granted *only* to the `attest` job below --
# `build` runs the PR's own tests/deps/CodeQL, so it must never be able to
# reach the signing credential itself (that's the whole point of splitting
# this into build -> attest -> verify; see the `attest` job's comment).
# No `administration` scope here either -- it isn't a scope GITHUB_TOKEN
# can be granted via this block at all (needed to query
# /repos/{owner}/{repo}/rules/branches/{branch}); see the "Generate GitHub
# App Token" step below, which mints a separate, narrowly-scoped token for
# that instead. `pull-requests: read` *is* granted, job-scoped to `build`
# alone (see its own `permissions:` block) -- needed for the PR-context
# lookup above; patch coverage itself still comes from local git diff, not
# the GitHub API.
permissions:
  contents: read
  security-events: write # Required for github/codeql-action/analyze to upload SARIF to code scanning

jobs:
  # Runs the PR's own code: tests, coverage, CodeQL, SonarQube, RCS scoring.
  # Produces one *unsigned* RCS statement file and nothing else that crosses
  # into the attest job below -- no id-token permission here at all, so
  # nothing running in this job (including a compromised dependency or a
  # malicious test-suite change) can mint a Sigstore signing identity.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read # "Resolve PR Context for a Push-Triggered Run" below
    outputs:
      # Consumed by `attest` below as subject-name/subject-digest -- the
      # only provenance-relevant values the isolated signer job accepts
      # from this (untrusted) job; everything else it needs to construct
      # real SLSA Build Level 3 provenance comes from its own trusted
      # context instead (see that job's `uses:` comment).
      image-ref: ${{ steps.mint.outputs.image-ref }}
      image-digest: ${{ steps.mint.outputs.image-digest }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history needed to calculate patch coverage diff

      # No explicit build step needed between init and analyze: Python is
      # extracted statically by the CodeQL CLI rather than traced through a
      # compile/autobuild step (unlike compiled languages), so running the
      # test suite in between (below) is just this workflow's own test
      # step, not something CodeQL depends on.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # uv resolves and installs the dependency set far faster than pip
      # (no full backtracking resolver invocation, and its own content-
      # addressed cache avoids re-downloading/re-building wheels run to
      # run). `enable-cache: true` persists that cache across workflow
      # runs via actions/cache internally, keyed off cache-dependency-glob.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --frozen: install exactly what uv.lock pins (versions *and*
      # hashes), refusing to re-resolve even if pyproject.toml has
      # drifted from it -- deterministic, reproducible builds, and no
      # arbitrary "resolve whatever's newest and compatible today" step
      # that could pull in a since-compromised transitive dependency
      # between runs. `--extra dev` brings in pytest/pytest-cov/
      # pytest-xdist/jsonschema alongside the core runtime deps, all from
      # the one lockfile -- nothing installed ad hoc outside it.
      - name: Install Dependencies
        run: |
          uv sync --frozen --extra dev

      # Generates a canonical CycloneDX SBOM of this repo via Syft, fed to
      # this repo's own mint step below via --sbom -- closes S2C2F SCA-2
      # ("License Checks") and backs INV-1/ING-1 from a real, native SBOM.
      # Same recipe already proven in lucid-console/lucid-dsse-collector/
      # lucid-attest-service's own dogfood pipelines -- this repo (the one
      # that actually built --sbom ingestion) was the one dogfood workflow
      # that never got it wired in, found while auditing the platform for
      # other supported-language enhancements, not a fresh design. Run
      # after `uv sync` (deliberately, same as the other three repos'
      # post-install placement) so the real installed dependency closure
      # (.venv/) is what gets cataloged, not just pyproject.toml's own
      # declared ranges -- and before "Execute Tests with Telemetry"
      # creates build/, so there's no stray build output for Syft to see.
      # Unlike the other three repos' copy of this step, no --exclude is
      # needed for a nested self-checkout: lucid-assay's own build job
      # never vendors a second, nested checkout of itself the way their
      # `_assay/` does. It does need one for a different, real noise
      # source, found empirically 2026-09-04 against a real signed run's
      # SBOM: Syft's uv.lock-entry cataloger re-lists every installed
      # Python package a *second* time (metadataType
      # "python-uv-lock-entry") with zero license metadata -- uv.lock
      # carries none -- duplicating the same package the
      # python-installed-package-cataloger already correctly reported
      # (real dist-info METADATA, real license) moments earlier. Left in,
      # this doubled the license-policy tool's "unclassified" warning
      # count for every dependency the lockfile also names. --exclude
      # './uv.lock' stops Syft from cataloging the lockfile a second,
      # redundant way; the real dependency-lockfile parsing this repo
      # does elsewhere (cli/parsers/lockfiles.py, feeding
      # resolved_dependencies) reads uv.lock directly and is entirely
      # unaffected -- this exclude only scopes what Syft itself walks.
      #
      # --user matches the runner's own UID so Syft's container (whose own
      # default user isn't the runner's) doesn't write a root-owned
      # build/sbom.cdx.json into this bind-mounted workspace -- a later
      # step reading it as the runner user would otherwise fail on
      # permissions. Same digest-verification discipline as every other
      # pinned image in this platform: confirmed directly against GHCR's
      # own API, not copied from an unverified source.
      - name: Generate CycloneDX SBOM (Syft)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:. \
            --exclude './uv.lock' \
            --exclude './**/__pycache__/**' \
            --exclude './**/*.egg-info/**' \
            --exclude './build/**' \
            --exclude './dist/**' \
            -o cyclonedx-json=build/sbom.cdx.json
          test -s build/sbom.cdx.json || { echo "ERROR: Syft did not produce build/sbom.cdx.json" >&2; exit 1; }

      # Platform-agnostic vulnerability scan via Grype, pointed at the SBOM
      # Syft just generated -- same recipe as the other three repos' own
      # copy of this step, including its two real fixes: GRYPE_DB_CACHE_DIR
      # and TMPDIR both redirected (the non-root --user override above has
      # no writable $HOME for either the vulnerability-DB cache or Grype's
      # own DB-update-check temp file -- see lucid-console's own comment
      # for the exact failure this closes, confirmed via a real run
      # there). Named accurately, not "vulnerability and EOL scan": Grype
      # does not detect EOL/unmaintained packages.
      - name: Scan for vulnerabilities (Grype)
        run: |
          mkdir -p build/.grype-db-cache build/.grype-tmp
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GRYPE_DB_CACHE_DIR=/workspace/build/.grype-db-cache \
            -e TMPDIR=/workspace/build/.grype-tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/anchore/grype@sha256:8a93fc48da96bd6ec5981279d099b69de11541dc68fdf222fb9161f8ff284af7 \
            sbom:build/sbom.cdx.json \
            -o sarif=build/grype.sarif
          test -s build/grype.sarif || { echo "ERROR: Grype did not produce build/grype.sarif" >&2; exit 1; }

      # `uv run --no-sync`: execute inside the environment `uv sync` just
      # populated without uv re-checking/re-syncing it first (already
      # synced explicitly above, so that would just be redundant work) --
      # not a second, different environment.
      - name: Execute Tests with Telemetry
        run: |
          mkdir -p build
          # --cov-context=test tags every covered line with which test(s)
          # executed it (coverage.py's "dynamic contexts"), needed for
          # cli.real_coverage's vanity-test-aware coverage cross-reference
          # below -- survives pytest-xdist's automatic per-worker
          # .coverage combine, confirmed empirically. --cov-report=xml
          # (Cobertura, no context info) still feeds cli.main's own
          # --coverage-report as before; the context data lives in the
          # exported JSON produced by the next step instead.
          uv run --no-sync pytest \
            -n auto \
            --junitxml=build/junit.xml \
            --cov=cli \
            --cov-context=test \
            --cov-report=xml:build/coverage.xml \
            tests/
          uv run --no-sync coverage json --show-contexts -o build/coverage-contexts.json

      # `output` is a directory, not a file: the CodeQL CLI names the SARIF
      # file after the analyzed language itself, so a single `languages:
      # python` init (above) produces build/codeql/python.sarif here --
      # the exact path cli.main's --sarif expects below. `upload` defaults
      # to "always" (uploads to GitHub code scanning too, hence
      # security-events: write above); left at its default since surfacing
      # findings in the Security tab is independent of also feeding them
      # into the attestation.
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: build/codeql
          category: python

      # SONAR_TOKEN, like APP_PRIVATE_KEY above, is unavailable in the
      # restricted `pull_request` context a fork PR runs under -- guarded
      # the same way, so an external contributor's PR degrades (no
      # SonarQube enrichment) instead of failing outright.
      #
      # Also unavailable, confirmed by a real failure (2026-09-02, PR #63 --
      # Dependabot's own first bump PR against this repo): GitHub applies
      # the identical secrets/permissions restriction to any `pull_request`
      # run whose actor is `dependabot[bot]`, EVEN when head.repo equals
      # this repo -- a same-repo PR the fork-only check above doesn't
      # catch. Without this, SonarQube fails outright with "Not authorized
      # or project not found" on every Dependabot PR, not just external
      # contributors' -- a self-inflicted regression from adopting
      # Dependabot itself, not a broken/expired token.
      # Project metadata (organization, projectKey, sources, coverage/xunit
      # paths) lives in sonar-project.properties at the repo root -- the
      # action reads it automatically, so it's the single source of truth
      # rather than duplicating those same values here via `args:` (two
      # copies of "where are the sources" is exactly how that file's
      # sonar.sources briefly pointed at a nonexistent src/ directory
      # instead of cli/).
      - name: SonarQube Cloud Scan
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # SonarQube Cloud's scanner analyzes server-side and doesn't emit a
      # local SARIF file the way CodeQL does -- there is no scanner
      # property that makes it write one out (`sonar.sarif.reportPaths` is
      # an *input* for feeding an existing SARIF into Sonar, not an
      # output toggle). Its quality-gate/complexity/debt metrics are
      # pulled back out via the Measures API instead, matching
      # cli.parsers.sarif.parse_sonar_metrics_file's expected
      # {"component": {"measures": [...]}} shape, and merged into a
      # scanned tool's extensions via --sonar-metrics below.
      # continue-on-error: enrichment data only -- cli.main already
      # degrades to a warning (not a failure) when --sonar-metrics can't
      # be read, so a transient API hiccup here must never fail the job.
      - name: Fetch SonarQube Cloud Measures
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # HTTP Basic auth (token as username, empty password) rather than
          # a Bearer header: it's the auth method SonarCloud/SonarQube user
          # tokens have supported across every scanner/API version, where
          # Bearer support is newer and version-dependent.
          curl -sSf \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component?component=lucid-provenance_lucid-assay&metricKeys=alert_status,sqale_index,cognitive_complexity" \
            -o build/sonar-measures.json

      # Mints a short-lived GitHub App installation token so branch-governance
      # inspection (cli.parsers.github_rules) can query the rules-for-branch
      # and rulesets endpoints, which require 'Administration: Read'
      # repository permission -- a permission the default GITHUB_TOKEN can
      # never be granted via this workflow's `permissions:` block (see the
      # comment there). Skipped for fork PRs: `secrets.APP_PRIVATE_KEY` is
      # unavailable in the restricted `pull_request` context those run
      # under (see the top-of-file comment), so this step would otherwise
      # fail every external contributor's PR outright. Also skipped for
      # Dependabot PRs, for the identical reason (confirmed by the same
      # real SonarQube failure that motivated this -- see that step's own
      # comment): GitHub withholds secrets from a `pull_request` run
      # whose actor is `dependabot[bot]` even when head.repo matches this
      # repo. When skipped, the token output is empty and cli.main /
      # cli.parsers.github_rules degrade branch-governance data to
      # unavailable rather than raising (see cli/parsers/github_rules.py's
      # module docstring).
      #
      # permission-contents: read -- also mints this, for cli.parsers.
      # commit_author's GET /repos/{repo}/commits/{sha} call (SLSA Source
      # Level 3's commit-author verification). This repo being public
      # masked the gap until now: a public repo's commits endpoint is
      # readable by a token with basically any valid grant, but a private
      # repo's requires this permission explicitly -- confirmed by a real
      # divergence, 2026-09-02 (this check passing here, failing
      # identically in lucid-console/lucid-dsse-collector with "HTTP 403:
      # Resource not accessible by integration"). Requesting it here too,
      # even though masked, rather than relying on this repo staying
      # public -- the same "don't gate policy on repo visibility" caveat
      # branch governance's own note already makes.
      - name: Generate GitHub App Token
        id: app-token
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: read

      # push carries no PR context of its own -- see the `on:` block's
      # comment for the full rationale. Looks up whichever PR GitHub
      # associates with the pushed commit itself (works uniformly for
      # merge/squash/rebase, and for a still-open PR's own branch commits
      # too); empty outputs (no associated PR) are a legitimate, handled
      # case -- the mint step below falls back to no PR context exactly
      # as it already does for workflow_dispatch.
      - name: Resolve PR Context for a Push-Triggered Run
        id: pr-context
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Right after a merge, GitHub's own "list PRs associated with
          # commit" API can return an empty response body while its
          # backend indexing catches up -- confirmed for real (2026-09-03,
          # lucid-dsse-collector, immediately after merging a real PR): jq
          # then fails with "unexpected end of JSON input" on the empty
          # string, a transient race, not a persistent state. Bounded
          # retry (5 attempts, 3s apart -- provably bounded, never an
          # unbounded/tight loop, same discipline cli/oidc_signer.py's own
          # ambient-token-fetch retry already uses) rather than a single
          # unguarded call.
          pulls_json=""
          for attempt in 1 2 3 4 5; do
            pulls_json="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")"
            echo "$pulls_json" | jq -e . >/dev/null 2>&1 && break
            echo "WARNING: attempt $attempt/5: commits/.../pulls returned non-JSON (likely a GitHub indexing race right after a merge) -- retrying in 3s" >&2
            sleep 3
          done
          echo "$pulls_json" | jq -e . >/dev/null 2>&1 || { echo "ERROR: commits/.../pulls never returned valid JSON after 5 attempts" >&2; exit 1; }
          echo "base-sha=$(echo "$pulls_json" | jq -r '.[0].base.sha // empty')" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pulls_json" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # Deliberately no --sign/--dry-run-sign here: this job has no
      # id-token permission, so it could not mint a Sigstore identity even
      # if it tried. Written unsigned; the separate `attest` job below
      # (the only one with id-token: write) signs it from the artifact
      # this step uploads, never from anything it computes itself.
      #
      # No --emit-slsa-provenance here anymore: this job only mints the
      # assay/v1 RCS statement now. SLSA v1.0 provenance (Build Level 3)
      # is constructed by `attest` below, inside the isolated signer job,
      # from that job's own trusted context -- not by this (untrusted)
      # job -- see that job's `uses:` comment for why.
      - name: Mint Unsigned Lucid Attestation
        id: mint
        env:
          GOVPLANE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Event-driven SHA resolution: base.sha is populated by GitHub
          # directly on the pull_request event payload itself, at the time
          # the run was triggered. It is used as-is, deliberately with no
          # runner-side `git merge-base` fallback -- computing a merge-base
          # on the runner is ambiguous (it reflects the *runner's* current
          # view of history, which can differ from the base GitHub actually
          # resolved the event against) and must never silently substitute
          # for the authoritative event value. On a push event, falls back
          # to whatever "Resolve PR Context for a Push-Triggered Run" found
          # (empty for a push with no associated PR).
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr-context.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr-context.outputs.number }}
          # On a pull_request event, github.ref_name is the synthetic
          # "<number>/merge" ref (e.g. "5/merge"), not a real branch --
          # querying branch governance for that name 404s/403s every time.
          # --branch feeds cli.parsers.github_rules.inspect_branch_governance
          # and is recorded as the attestation's target branch, so what's
          # wanted here is the PR's actual base branch (the one protection
          # rules apply to); github.ref_name is only correct on a direct push.
          BRANCH_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          EXTRA_ARGS=(--debug)
          if [ -n "$BASE_SHA" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "ERROR: BASE_SHA resolved but PR_NUMBER did not; refusing to mint with inconsistent PR context" >&2
              exit 1
            fi
            EXTRA_ARGS=(--base-sha "$BASE_SHA" --pr-number "$PR_NUMBER")
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ERROR: github.event.pull_request.base.sha was empty on a pull_request event; refusing to guess a base commit" >&2
            exit 1
          fi

          # CodeQL always runs (no secret dependency), but the SARIF path
          # is still guarded on existence rather than assumed -- if the
          # CodeQL CLI's output-naming convention ever changes, this run
          # should degrade (cli.main treats a missing --sarif file as a
          # warning, not a hard failure) rather than break the mint step.
          # SonarQube's measures export is guarded the same way since its
          # own step above is fork-PR-skipped and continue-on-error.
          if [ -f build/codeql/python.sarif ]; then
            EXTRA_ARGS+=(--sarif build/codeql/python.sarif)
          else
            echo "WARNING: build/codeql/python.sarif not found; skipping CodeQL SARIF ingestion" >&2
          fi
          if [ -f build/sonar-measures.json ]; then
            EXTRA_ARGS+=(--sonar-metrics build/sonar-measures.json)
          fi
          # --sarif is repeatable -- aggregated alongside CodeQL's, not a
          # replacement for it. Unconditional (not existence-guarded like
          # CodeQL's own, above): the "Generate CycloneDX SBOM (Syft)" /
          # "Scan for vulnerabilities (Grype)" steps already hard-fail the
          # job if they didn't produce their output file, so by the time
          # this runs both are guaranteed present -- same convention the
          # other three repos' own copy of this wiring already uses.
          EXTRA_ARGS+=(--sbom build/sbom.cdx.json --sarif build/grype.sarif)
          # Same existence-guarded pattern: the "Execute Tests with
          # Telemetry" step above always produces this file, but degrading
          # to "real coverage analysis unavailable" (cli.main treats a
          # missing --coverage-contexts as simply not configured) rather
          # than failing the mint step if that ever stops being true.
          if [ -f build/coverage-contexts.json ]; then
            EXTRA_ARGS+=(--coverage-contexts build/coverage-contexts.json)
          else
            echo "WARNING: build/coverage-contexts.json not found; skipping real-coverage analysis" >&2
          fi

          echo "Running with EXTRA_ARGS: ${EXTRA_ARGS[*]}"

          IMAGE_REF="ghcr.io/${{ github.repository }}:${HEAD_SHA}"
          IMAGE_DIGEST="sha256:$(git rev-parse HEAD | sha256sum | awk '{print $1}')"
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          uv run --no-sync python -m cli.main \
            --junit-xml build/junit.xml \
            --coverage-report build/coverage.xml \
            --image-ref "$IMAGE_REF" \
            --image-digest "$IMAGE_DIGEST" \
            --head-sha "${HEAD_SHA}" \
            --repository "${{ github.repository }}" \
            --branch "${BRANCH_NAME}" \
            --github-token "$GOVPLANE_GITHUB_TOKEN" \
            --min-rcs 65 \
            --out build/lucid-assay.unsigned.json \
            "${EXTRA_ARGS[@]}"

          # --sbom above also makes cli.main write a *second*, separate
          # in-toto statement wrapping the SBOM's own raw document --
          # fixed-basename-sibling-of-out convention, same check the other
          # three repos' own copy of this wiring already makes.
          test -s build/sbom.unsigned.json || {
            echo "ERROR: --sbom was passed but build/sbom.unsigned.json was not produced (see the mint step's own stderr WARNING above for why)" >&2
            exit 1
          }

          # --sarif (Grype above, plus CodeQL when its own output existed)
          # also makes cli.main write a *third*, separate in-toto statement
          # wrapping every raw --sarif input's own document, keyed by tool
          # name (cli/sarif_statement.py) -- fixed-basename-sibling-of-out
          # convention, same check --sbom's own statement above makes.
          test -s build/sarif-reports.unsigned.json || {
            echo "ERROR: --sarif was passed but build/sarif-reports.unsigned.json was not produced (see the mint step's own stderr WARNING above for why)" >&2
            exit 1
          }

      - name: Upload Unsigned Statements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-statements
          path: |
            build/lucid-assay.unsigned.json
            build/sbom.unsigned.json
            build/sarif-reports.unsigned.json
          if-no-files-found: error

  # The *only* job with id-token: write -- signs the RCS statement `build`
  # uploaded, and -- via subject-name/subject-digest below -- additionally
  # CONSTRUCTS a SLSA v1.0 provenance statement (SLSA Build Level 3) from
  # its own trusted context and signs that too, atomically. The signing
  # job's code lives entirely in lucid-provenance/lucid-attest-service (a
  # separate, deployed Lambda-backed service), invoked here as a reusable
  # workflow pinned to a commit SHA (`uses:` below) independently of
  # whatever ref triggered this run -- so a PR that fully rewrites this
  # workflow file, or lucid-assay's own pipeline code, in the same PR
  # cannot also change what the signer trusts, since that code isn't part
  # of this PR's diff at all.
  #
  # subject-name/subject-digest are the only provenance-relevant values
  # the isolated signer job accepts from this (untrusted) job: everything
  # else that makes the statement SLSA-meaningful -- builder identity,
  # source binding, resolved dependencies -- comes from the signer's own
  # ambient context and its own read-only source checkout, never from
  # anything this job computed.
  #
  # This job has no way to choose which lucid-assay commit sign-client.yml
  # checks out for cli/oidc_signer.py/cli/provenance.py: that pin lives
  # hardcoded inside lucid-attest-service's own sign-client.yml
  # (env.PROVENANCE_SOURCE_SHA) and its ci.yml/deploy.yml
  # (env.SIGNER_SOURCE_SHA), not as a `workflow_call` input here -- a
  # caller-supplied ref input would let the privileged signing job be
  # pointed at caller-chosen code, defeating the isolation this whole
  # mechanism exists for. Bumping which lucid-assay commit the signer
  # trusts is exclusively a lucid-attest-service-repo change, same
  # discipline as bumping the `uses:` SHA below whenever
  # lucid-attest-service's own sign-client.yml changes.
  attest:
    needs: build
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting
      contents: read
    # This line is now the SOLE literal source of truth for the pinned
    # signer commit -- `verify`'s own "Derive expected signer identity"
    # step below parses it live to build --cert-identity, rather than
    # trusting a separately hand-kept-in-sync copy (env.SIGNER_WORKFLOW_SHA
    # existed for exactly that purpose until 2026-09-02; removed because a
    # Dependabot bump PR only ever updates a `uses:` line, never a
    # same-value literal duplicated elsewhere in the file -- see the
    # comment in .github/dependabot.yml for the failure mode this closes).
    #
    # CUT OVER 2026-09-03 from lucid-attest's sign.yml (a pinned Docker
    # signer container, since retired) to lucid-attest-service's
    # sign-client.yml (a Lambda-backed reusable workflow, same isolated-
    # builder-identity property -- see the Lucid vault's "Serverless
    # signer needs a trustworthy provenance builder identity" note for the
    # full trust-model reasoning). Overdue, not routine: lucid-console and
    # lucid-dsse-collector, this repo's own downstream consumers, both cut
    # over 2026-09-02 -- this repo's own dogfood workflow was missed in
    # that same pass and found still pointed at the retired lucid-attest
    # repo entirely, while auditing every repo's own independent signer/
    # source pin for silent drift -- see the vault's "Signer SHA pinning
    # pain" note.
    uses: lucid-provenance/lucid-attest-service/.github/workflows/sign-client.yml@231039b08b91b78788dba732a10355aafcaeaa11
    with:
      artifact-name: unsigned-statements
      statement-files: |
        lucid-assay.unsigned.json
        sbom.unsigned.json
        sarif-reports.unsigned.json
      subject-name: ${{ needs.build.outputs.image-ref }}
      subject-digest: ${{ needs.build.outputs.image-digest }}

  # Downloads the signed envelopes `attest` produced and evaluates
  # lucid-assay's own admission policy gates against them, plus both SLSA
  # tracks (Source, Build) in one unified report. No id-token permission
  # here either -- reading/verifying a signature doesn't require one,
  # only minting one does.
  verify:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Single source of truth: parses the exact `uses:` line the `attest`
      # job above already invokes, rather than trusting a separately
      # hand-kept-in-sync literal (removed 2026-09-02 -- see that job's
      # own `uses:` comment for why). Scoped to our own well-known
      # `attest:` job shape, not a general YAML parser -- this file's
      # shape is ours to keep stable, and no YAML-parsing dependency
      # exists anywhere in this repo to lean on instead.
      - name: "Derive expected signer identity from the attest job's own uses: pin"
        id: signer
        run: |
          SIGNER_USES="$(awk '/^  attest:/{f=1} f && /^ *uses:/{print; exit}' \
            .github/workflows/assay.yml | sed -E 's/^\s*uses:\s*([^ ]+).*/\1/')"
          if [ -z "$SIGNER_USES" ]; then
            echo "ERROR: could not parse the attest job's uses: line from .github/workflows/assay.yml -- did the job shape change?" >&2
            exit 1
          fi
          echo "cert-identity=https://github.com/${SIGNER_USES}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --frozen --extra dev

      # Sigstore identity verification (below) fetches the same TUF trust
      # root a fresh cache miss would otherwise re-download every run --
      # see the identical step in the `attest` job above for why this is
      # safe to treat as a pure cache-hit optimization, never a
      # correctness dependency.
      - name: Cache Sigstore TUF Metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download Signed Statements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-statements
          path: build

      # --write-verdict overwrites build/lucid-assay.dsse.json in place
      # with this exact call's FAILED/GATED/PASSED word/banner/rcs_value/
      # degraded/source_level/build_level/gate_params (plus the itemized
      # SLSA checklists) as an unsigned `_verdict` sibling field, then
      # "Upload In-Toto Attestation Artifact" below re-uploads that
      # annotated file. Needed here for the same reason as lucid-console/
      # lucid-dsse-collector's identical addition: this repo's own split
      # mint(unsigned)/sign(isolated `attest` job, via lucid-attest-
      # service's reusable sign-client.yml) architecture never runs
      # cli.main's own
      # run --sign/--dry-run-sign pipeline (the only place verdict
      # annotation happens automatically) -- `attest` only ever calls
      # `cli.main sign`, a different code path with no verdict step.
      # Without this flag, lucid-assay's own dogfood attestations never
      # carry a verdict at all, on any branch (not specific to a PR vs.
      # main -- this job simply never wrote one).
      - name: Verify Lucid Attestation Gate
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          # Pins the admission gate to the exact quarantined signer identity:
          # not just "some workflow in lucid-provenance/lucid-attest-service",
          # but that repo's sign-client.yml specifically, at the same commit SHA `attest` invoked --
          # derived live from that job's own `uses:` line by the
          # "Derive expected signer identity" step above, not a separately
          # hand-kept-in-sync literal, so this can never drift from what
          # `attest` actually invoked even if only the `uses:` line changes.
          # --expected-repository/--expected-ref alone only constrain claims
          # about *this* repo's own ref -- they say nothing about which
          # workflow minted the OIDC token, so without --cert-identity any
          # other job in lucid-assay that ever acquired id-token: write could
          # sign an envelope this gate would still accept.
          CERT_IDENTITY: ${{ steps.signer.outputs.cert-identity }}
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          # Binds admission to the *caller* side of the identity too: not
          # just "signed by the quarantined lucid-attest-service signer"
          # (that's what --cert-identity above already pins), but "signed on
          # behalf of a run this workflow itself triggered" -- github.workflow is
          # this workflow's own `name:` ("Lucid Assay"), which GitHub's OIDC
          # token carries as the `workflow` claim for every job in this run,
          # including the reusable `attest` job. Without this, any other
          # workflow in lucid-provenance/lucid-assay (present or future) that ever
          # called the same lucid-attest-service signer would still pass this gate,
          # since --expected-repository alone doesn't distinguish which
          # workflow file within the repo triggered the signing.
          EXPECTED_WORKFLOW: ${{ github.workflow }}
        run: |
          # Built as a bash array, not a string handed to word-splitting:
          # the previous string-concatenation form embedded literal `"`
          # characters into each flag's value (they were inside an
          # already-double-quoted string, so `\"` had no quoting effect),
          # which made --expected-repository/--expected-ref never match the
          # real certificate claims and failed the gate on every run.
          # --require-slsa-build-l3: enabled 2026-09-03. Both Build Level 3
          # items (unforgeable control-plane builder identity, isolated
          # provenance generation) have been genuinely passing for real on
          # every current caller across the platform since the
          # lucid-attest-service cutover -- confirmed against real CI runs
          # on this repo and lucid-console/lucid-dsse-collector/
          # lucid-attest-service the same day this flag was flipped, not
          # assumed. Unconditional (unlike --disallow-degraded below,
          # which is deliberately scoped away from an early feat/** WIP
          # push with no PR context yet): Build Level 3 has nothing to do
          # with PR context -- the isolated-signer identity chain is
          # present identically on every run through this pipeline, so
          # there's no legitimate "not yet" state for it the way there is
          # for governance/degraded checks.
          VERIFY_ARGS=(
            --min-rcs 65
            --expected-repository "$EXPECTED_REPOSITORY"
            --expected-ref "$EXPECTED_REF"
            --expected-workflow "$EXPECTED_WORKFLOW"
            --cert-identity "$CERT_IDENTITY"
            --cert-oidc-issuer "$CERT_OIDC_ISSUER"
            --slsa-envelope build/provenance.dsse.json
            --require-slsa-build-l3
            --write-verdict
          )
          # pull_request (pre-merge) and push-to-main (post-merge/promotion,
          # now that "Resolve PR Context for a Push-Triggered Run" keeps it
          # from degrading on missing PR context -- see the `on:` block's
          # comment) are both gate-enforced. A plain push to a feat/**
          # branch is deliberately NOT enforced here: it may have no
          # associated PR yet (a genuine early WIP push), in which case
          # minting without PR context is expected and shouldn't block --
          # that branch's own eventual PR (or its post-merge push to main)
          # is what actually gets gated.
          #
          # Also exempted: Dependabot-actor pull_request runs. Real failure,
          # 2026-09-02: "Generate GitHub App Token" is deliberately skipped
          # for these (GitHub withholds secrets from a pull_request run
          # whose actor is dependabot[bot], even same-repo -- see that
          # step's own comment), which makes branch governance come back
          # branch_governance_unverified -- a real, distinct degraded reason
          # from branch_governance:platform_unsupported_tier, and NOT in
          # cli.verify's _ALLOWED_DEGRADED_REASONS. Without this exemption,
          # every Dependabot PR fails this gate unconditionally, forever,
          # regardless of how trivial or correct the actual bump is (a
          # clean actions/checkout version bump, PR #71, is what surfaced
          # this). The bump itself is still fully built, signed, and
          # verified otherwise -- only the strict admission gate is
          # structurally unreachable for this actor, the same reasoning
          # that already exempts it from the App-token/SonarQube steps.
          if { [ "${{ github.event_name }}" = "pull_request" ] || [ "$EXPECTED_REF" = "refs/heads/main" ]; } && [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            VERIFY_ARGS+=(--disallow-degraded)
          fi

          uv run --no-sync python -m cli.verify build/lucid-assay.dsse.json "${VERIFY_ARGS[@]}"

      - name: Upload In-Toto Attestation Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lucid-assay-attestation
          path: |
            build/lucid-assay.dsse.json
            build/provenance.dsse.json
            build/sbom.dsse.json
            build/sarif-reports.dsse.json
          if-no-files-found: error
