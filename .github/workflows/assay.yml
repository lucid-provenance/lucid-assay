name: Plinth Assay

# Deliberately `pull_request`, NOT `pull_request_target`: this workflow
# checks out and executes code from the PR head ref, so it must run in the
# restricted, no-secrets context `pull_request` provides for fork PRs.
# `pull_request_target` runs with base-branch permissions/secrets against
# untrusted fork code and must never be substituted here.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for Sigstore keyless OIDC minting
  contents: read
  pull-requests: read

jobs:
  assay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Full history needed to calculate patch coverage diff

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" sigstore pytest pytest-cov

      - name: Execute Tests with Telemetry
        run: |
          mkdir -p build
          pytest \
            --junitxml=build/junit.xml \
            --cov=cli \
            --cov-report=xml:build/coverage.xml \
            tests/

      - name: Mint Signed Plinth Attestation
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Event-driven SHA resolution: base.sha is populated by GitHub
          # directly on the pull_request event payload itself, at the time
          # the run was triggered. It is used as-is, deliberately with no
          # runner-side `git merge-base` fallback -- computing a merge-base
          # on the runner is ambiguous (it reflects the *runner's* current
          # view of history, which can differ from the base GitHub actually
          # resolved the event against) and must never silently substitute
          # for the authoritative event value.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXTRA_ARGS=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ]; then
              echo "ERROR: github.event.pull_request.base.sha was empty on a pull_request event; refusing to guess a base commit" >&2
              exit 1
            fi
            EXTRA_ARGS="--base-sha $BASE_SHA --pr-number $PR_NUMBER"
          fi

          echo "Running with EXTRA_ARGS: $EXTRA_ARGS"

          python -m cli.main \
            --junit-xml build/junit.xml \
            --coverage-report build/coverage.xml \
            --image-ref "ghcr.io/${{ github.repository }}:${HEAD_SHA}" \
            --image-digest "sha256:$(git rev-parse HEAD | sha256sum | awk '{print $1}')" \
            --head-sha "${HEAD_SHA}" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --min-rcs 65 \
            --sign \
            --out build/plinth-assay.dsse.json \
            $EXTRA_ARGS

      - name: Verify Plinth Attestation Gate
        run: |
          VERIFY_ARGS="--min-rcs 65"
          VERIFY_ARGS="$VERIFY_ARGS --expected-repository \"${{ github.repository }}\""
          VERIFY_ARGS="$VERIFY_ARGS --expected-ref \"${{ github.ref }}\""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERIFY_ARGS="$VERIFY_ARGS --disallow-degraded"
          fi

          python -m cli.verify build/plinth-assay.dsse.json $VERIFY_ARGS
      - name: Upload In-Toto Attestation Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plinth-assay-attestation
          path: build/plinth-assay.dsse.json
          if-no-files-found: error