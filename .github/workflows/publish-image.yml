name: Publish Assay Image

# run-name: overrides the Actions run-list headline, which otherwise
# defaults to the triggering commit message -- indistinguishable at a
# glance from Lucid Assay's own run on the same commit (both workflows
# can legitimately fire off one push that touches cli/**). Falls back to
# github.ref_name on workflow_dispatch, where head_commit doesn't exist.
run-name: "Publish image: ${{ github.event.head_commit.message || github.ref_name }}"

# Builds, pushes, and Sigstore-signs the immutable lucid-assay CLI image
# (Lucid roadmap Milestone #19). Triggered on every push to main that
# touches the image's own actual inputs (cli/, pyproject.toml, uv.lock,
# Dockerfile) -- a docs-only or test-only merge wouldn't produce a
# meaningfully different image, so it doesn't get one.
#
# Tagged by commit SHA only -- deliberately no `latest` tag, consistent
# with this platform's own explicit-pinning stance elsewhere (a `latest`
# tag would just invite the un-pinned drift this whole product argues
# against). Anyone consuming this image for real should resolve and pin
# the digest -- see README.md's "Container image" section.
#
# Unlike lucid-attest's signer image (Milestone #18), there's no separate
# "which commit do we trust" pin to manage here at all: this image carries
# no trust-boundary constraint (see Dockerfile's own header), so it simply
# builds from whatever commit actually triggered the run.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "schema/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
  workflow_dispatch: {}

permissions: {}

env:
  IMAGE_NAME: ghcr.io/lucid-provenance/lucid-assay

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Sigstore keyless signing of the image itself (cosign)
      packages: write # Push to GHCR
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestation attachments disabled: this platform
      # has its own SLSA provenance story (cli/provenance.py) -- letting
      # buildx/BuildKit attach a second, differently-shaped attestation to
      # the same image would just be a confusing second source of truth,
      # same reasoning as build-signer-image.yml in lucid-attest.
      - name: Build and push assay image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing of the published image, by digest -- dogfoods the
      # platform's own trust model, same as #18's signer image and every
      # DSSE envelope this platform signs for a caller's own attestations.
      - name: Sign image with cosign (keyless)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Summarize published digest
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Assay image published"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE_DIGEST_REF"
            echo "\`\`\`"
            echo ""
            echo "Built from lucid-assay@\`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
