# Tracks every SHA-pinned `uses:` in this repo's own workflow files
# against their upstream tagged releases -- both third-party actions
# (e.g. actions/checkout) and the cross-repo lucid-attest/sign.yml pin,
# now that lucid-attest tags real releases (v1.0.0+). Opens a PR here
# proposing the bump, never merges automatically.
#
# The duplicate-pin danger this comment used to warn about (a bump PR
# only touching the `attest` job's `uses:` line, leaving a separately-
# maintained env var stale) is now closed structurally, not just by
# manual review discipline: `verify`'s own "Derive expected signer
# identity" step parses that `uses:` line live at runtime, so there's
# nothing left to duplicate or drift. A bump PR touching only the
# `uses:` line is fully self-consistent now.
#
# `groups` below is load-bearing, not cosmetic -- confirmed by a real
# failure, 2026-09-02: github/codeql-action/init and .../analyze must
# stay on matching versions (the config init writes is version-specific;
# a mismatch fails the job with "Loaded a configuration file for version
# 'X', but running version 'Y'"), but Dependabot opens one PR per `uses:`
# reference by default -- two separate PRs each bumped only one half of
# the pair, so each was individually broken until manually merged
# together. Grouping them forces one PR with both bumped atomically.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
